name: Check upstream for changes

# 週1で本家の差分を確認し、翻訳済みページに変更があれば issue を立てる。
# 翻訳の自動 PR は作らない。レビューなしの訳が積み上がるのを防ぐため、
# 着手のトリガーは必ず人間が引く（SETUP.md「自動化の温度感」）。
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.9
      - run: mise run install

      # 判定は sync-upstream.ts が $GITHUB_OUTPUT に書く changed / deleted で行う。
      # 人間向けの日本語の出力を grep すると、文言を変えた瞬間に静かに壊れる。
      - id: sync
        run: mise run sync | tee /tmp/sync-report.txt

      - if: steps.sync.outputs.changed != '0' || steps.sync.outputs.deleted != '0'
        uses: actions/github-script@v9
        env:
          CHANGED: ${{ steps.sync.outputs.changed }}
          DELETED: ${{ steps.sync.outputs.deleted }}
          UPSTREAM_REF: ${{ steps.sync.outputs.upstream_ref }}
        with:
          script: |
            const fs = require('node:fs')
            const report = fs.readFileSync('/tmp/sync-report.txt', 'utf8')
            const { CHANGED, DELETED, UPSTREAM_REF } = process.env

            const body = [
              `本家の原文が更新されています（\`${UPSTREAM_REF.slice(0, 12)}\`）。`,
              '',
              `- 変更のあった翻訳済みページ: ${CHANGED} 件`,
              `- 本家から削除されたページ: ${DELETED} 件`,
              '',
              '<details><summary><code>mise run sync</code> の出力</summary>',
              '',
              '```',
              report,
              '```',
              '',
              '</details>',
              '',
              '次にやること:',
              '',
              '1. ローカルで `mise run sync` を実行して `.sync/*.diff` を読む',
              '2. 訳に影響しない変更（typo 修正・リンク差し替え）なら更新不要と判断してよい',
              '3. 更新が必要なものは、変更されたブロックだけを訳し直す',
              '4. `mise run sync:apply` で `upstream/` を進め、訳の更新と同一コミットにする',
            ].join('\n')

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-sync',
            })

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Upstream documentation has changed',
                body,
                labels: ['upstream-sync'],
              })
            }
