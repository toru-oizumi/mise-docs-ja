name: Conventions

# 言語ルールを強制する。
# - コミットメッセージ: 英語 + Conventional Commits
# - PR のタイトル      : 英語 + Conventional Commits
# - PR の本文          : 日本語
#
# 検査対象はその PR に含まれるコミットだけ。main の既存履歴は遡って検査しない。
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # base..head の差分を取るため履歴を全部持ってくる
          fetch-depth: 0

      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.9

      - name: Collect commit messages in this PR
        id: commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # NUL 区切りで出して、複数行のコミットメッセージを取り違えないようにする
          git log --format=%B%x00 "$BASE_SHA..$HEAD_SHA" > /tmp/commits.txt
          echo "count=$(git rev-list --count "$BASE_SHA..$HEAD_SHA")" >> "$GITHUB_OUTPUT"

      - name: Check conventions
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          # ファイルのパスで渡す。bash の $(cat file) は NUL バイトを捨てるので、
          # 環境変数に中身を入れると複数のコミットが1件に化ける
          COMMITS_FILE: /tmp/commits.txt
        run: bun scripts/check-conventions.ts
